<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login &amp; Sign Up - Trail Mapping App</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS with Theme Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee2b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center">
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col overflow-hidden bg-background-light dark:bg-background-dark shadow-2xl">
<!-- Top App Bar -->
<div class="flex items-center px-4 py-4 justify-between sticky top-0 z-10 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-sm">
<button class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Log In</h2>
</div>
<!-- Main Content -->
<div class="flex-1 flex flex-col px-6 pt-4 pb-8">
<div class="mb-8">
<h1 class="text-slate-900 dark:text-slate-100 text-[32px] font-extrabold leading-tight tracking-tight mb-2">Welcome back, explorer</h1>
<p class="text-slate-500 dark:text-slate-400 text-base">Resume your adventure where you left off.</p>
</div>
<!-- Login Form -->
<form class="space-y-5">
<div class="space-y-2">
<label class="block text-slate-700 dark:text-slate-300 text-sm font-semibold" for="email">Email</label>
<input class="w-full h-14 px-4 rounded-xl bg-slate-100 dark:bg-[#1a2e1a] border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-medium" id="email" placeholder="Enter your email address" type="email"/>
</div>
<div class="space-y-2">
<label class="block text-slate-700 dark:text-slate-300 text-sm font-semibold" for="password">Password</label>
<div class="relative">
<input class="w-full h-14 pl-4 pr-12 rounded-xl bg-slate-100 dark:bg-[#1a2e1a] border border-slate-300 dark:border-slate-600 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-medium" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-0 top-0 h-full w-12 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" type="button">
<span class="material-symbols-outlined" style="font-size: 24px;">visibility_off</span>
</button>
</div>
</div>
<div class="flex justify-end">
<a class="text-primary hover:text-green-400 text-sm font-semibold transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full h-14 bg-primary hover:bg-green-400 text-background-dark font-bold text-lg rounded-full shadow-lg shadow-primary/20 transition-transform active:scale-[0.98] flex items-center justify-center mt-2" type="button">
                    Log In
                </button>
</form>
<div class="relative py-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-300 dark:border-slate-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-background-light dark:bg-background-dark text-slate-500 dark:text-slate-400 font-medium">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-3 gap-4 mb-8">
<button class="flex h-14 w-full items-center justify-center rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#1a2e1a] hover:bg-slate-50 dark:hover:bg-[#233b23] transition-colors">
<!-- Google Logo SVG -->
<svg class="h-6 w-6" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="flex h-14 w-full items-center justify-center rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#1a2e1a] hover:bg-slate-50 dark:hover:bg-[#233b23] transition-colors text-slate-900 dark:text-white">
<!-- Apple Logo SVG -->
<svg class="h-6 w-6 fill-current" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.63-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.2 2.42-1 3.23-.89 1.57.18 2.53.79 3.19 1.76-2.88 1.76-2.38 5.31.29 6.43-.64 1.74-1.57 3.31-2.49 4.87zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path>
</svg>
</button>
<button class="flex h-14 w-full items-center justify-center rounded-xl border border-slate-300 dark:border-slate-600 bg-[#FC4C02] hover:bg-[#E34300] transition-colors text-white">
<!-- Strava Style Logo (Simplified for demo) -->
<span class="font-bold tracking-tighter text-sm">STRAVA</span>
</button>
</div>
<!-- Sign Up CTA -->
<div class="mt-auto flex justify-center items-center gap-2 pb-6">
<p class="text-slate-500 dark:text-slate-400 font-medium">Don't have an account?</p>
<a class="text-primary hover:text-green-400 font-bold transition-colors" href="#">Sign Up</a>
</div>
</div>
</div>
</body></html>
