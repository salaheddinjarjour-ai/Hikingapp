<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dark Mode Interactive Trail Map</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00ff41","primary-dim": "#00cc33",
                        "background-dark": "#050505",
                        "surface-dark": "#1a1d1a",
                        "surface-darker": "#0a0c0a",
                        "neon-accent": "#39ff14",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "sans": ["Space Grotesk", "sans-serif"],
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                    boxShadow: {
                        "neon": "0 0 10px rgba(0, 255, 65, 0.3), 0 0 20px rgba(0, 255, 65, 0.1)",
                        "deep": "0 10px 30px -5px rgba(0, 0, 0, 0.8)",
                    }
                },
            },
        }
    </script>
<style>
        .map-texture {
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .contour-lines {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 50 Q 25 25 50 50 T 100 50' stroke='%2339ff14' stroke-width='0.5' fill='none' opacity='0.1'/%3E%3Cpath d='M0 30 Q 25 5 50 30 T 100 30' stroke='%2339ff14' stroke-width='0.5' fill='none' opacity='0.05'/%3E%3Cpath d='M0 70 Q 25 45 50 70 T 100 70' stroke='%2339ff14' stroke-width='0.5' fill='none' opacity='0.05'/%3E%3C/svg%3E");
            background-size: 200px 200px;
        }::-webkit-scrollbar {
            display: none;
        }
        .neon-text-shadow {
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-primary text-[16px]">schedule</span> 1h 45m</span>
</div>
</div>
<button class="self-center p-2.5 rounded-full bg-white/5 hover:bg-white/10 text-primary border border-white/5 hover:border-primary/30 transition-all">
<span class="material-symbols-outlined text-xl">directions</span>
</button>
</div>
</div>
<div class="relative z-30 bg-black border-t border-white/10 pb-8 pt-3 px-6 shadow-[0_-10px_40px_rgba(0,0,0,0.8)]">
