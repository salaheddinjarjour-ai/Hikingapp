<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TrailSense - Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#25f425",
                        "background-light": "#f5f8f5",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom gradient overlay for better text readability on the image */
        .cinematic-overlay {
            background: linear-gradient(to top, rgba(16, 34, 16, 1) 15%, rgba(16, 34, 16, 0.8) 35%, rgba(16, 34, 16, 0.2) 60%, rgba(16, 34, 16, 0) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 overflow-hidden h-screen w-full relative">
<!-- Immersive Background Image -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center bg-no-repeat z-0" data-alt="Mountain ridge landscape during golden hour" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB-veUF_VtxaoGDLrSJqGbCUmCF1atXBa_DiTATEjNbbizzl26RWriFZNQ4yHzDx4QZVxCtQgNKScmOCWxEbK6trSe0RIODz5qiUVcW8jQdu67cd1rgFONQfUNR2-VyFowCs2ttfyqoAHboaHc4dw5rma_gLZe-4zCHfFdxt39rHIvrh8Ako-iFyr_VfhYG2eGHv9TbTjCYvrXsJIg1JH_iBeNiRytbthjEh8mHg6ZmdorIAyy_76GWYKNhyUFqliKCbAw2bV8Je3Pn');"></div>
<!-- Gradient Overlay -->
<div class="absolute inset-0 w-full h-full cinematic-overlay z-10"></div>
<!-- Content Wrapper -->
<div class="relative z-20 h-full flex flex-col justify-between px-8 py-12">
<!-- Top Spacer (Can hold status bar area) -->
<div class="flex justify-between items-center opacity-0">
<span>9:41</span>
<div class="flex gap-1">
<span class="material-symbols-outlined text-[16px]">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[16px]">battery_full</span>
</div>
</div>
<!-- Center Content: Logo -->
<div class="flex-1 flex flex-col justify-center items-center gap-8 mb-16">
<!-- Subtle floating icons effect using flex placement -->
<div class="relative w-full max-w-[300px] h-[200px] flex items-center justify-center">
<!-- Floating Icon: Compass -->
<div class="absolute top-0 left-4 text-primary/40 rotate-[-15deg]">
<span class="material-symbols-outlined !text-[64px]">explore</span>
</div>
<!-- Floating Icon: Map Pin -->
<div class="absolute bottom-4 right-4 text-primary/30 rotate-[15deg]">
<span class="material-symbols-outlined !text-[56px]">location_on</span>
</div>
<!-- Main Logo -->
<div class="z-10 flex flex-col items-center">
<div class="bg-primary/20 p-4 rounded-full backdrop-blur-sm border border-primary/30 shadow-[0_0_30px_rgba(37,244,37,0.2)]">
<span class="material-symbols-outlined text-primary !text-[48px]">landscape</span>
</div>
<h1 class="text-white tracking-tight text-[42px] font-bold leading-tight mt-6 drop-shadow-lg">TrailSense</h1>
</div>
</div>
</div>
<!-- Bottom Section: Loader & Status -->
<div class="flex flex-col gap-5 w-full max-w-md mx-auto">
<!-- Mountain Silhouette Loader visualization -->
<div class="relative w-full h-12 flex items-end justify-center mb-2 overflow-hidden">
<!-- Static SVG Path -->
<svg class="w-full h-full text-white/20 stroke-current fill-none" preserveaspectratio="none" viewbox="0 0 300 50">
<path d="M0,50 Q40,40 60,30 T120,20 T180,35 T240,15 T300,50" stroke-width="2"></path>
</svg>
<!-- Active SVG Path (Progress) -->
<div class="absolute inset-0 w-full h-full overflow-hidden" style="width: 45%;">
<svg class="w-full h-full text-primary stroke-current fill-none min-w-full" preserveaspectratio="none" viewbox="0 0 300 50">
<path d="M0,50 Q40,40 60,30 T120,20 T180,35 T240,15 T300,50" stroke-width="3"></path>
</svg>
</div>
</div>
<!-- Text Status -->
<div class="flex flex-col gap-1">
<div class="flex justify-between items-end">
<p class="text-slate-100 text-lg font-medium leading-normal tracking-wide">Preparing your adventure...</p>
<p class="text-primary text-sm font-bold leading-normal">45%</p>
</div>
<p class="text-slate-400 text-sm font-normal leading-normal">Loading trails, maps &amp; terrain</p>
</div>
</div>
</div>
</body></html>
